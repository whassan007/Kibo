      - kibo-is/core/middleware/tenant_isolation.py
      - kibo-is/tests/test_tenant_isolation_x02.py
    assignment: "PostgreSQL, migrations, tenant isolation and data integrity"
    dependencies: [X01]

  - agent_id: X03
    runtime: codex-cli
    host: localhost
    model: codex-default
    branch: hardening/v2026.10.1/X03-discovery-pipeline-scheduler
    owned_paths:
